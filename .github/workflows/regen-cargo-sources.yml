name: "Regenerate Flatpak cargo-sources.json (debug, manual only)"

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install generator dependencies
        run: pip install aiohttp toml

      - name: Download flatpak-cargo-generator.py
        run: curl -sSL -o flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py

      - name: Regenerate cargo-sources.json
        run: python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o flatpak/cargo-sources.json

      - name: Upload regenerated file
        uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: flatpak/cargo-sources.json
