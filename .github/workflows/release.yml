name: "Release"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  # Linux runs first and is the one that actually creates the GitHub release (tauri-action creates
  # it on first upload). publish-tauri-windows and flatpak-bundle both just upload additional
  # assets to that already-created release afterwards, which is what avoids the release-creation
  # race condition we used to hit when both platforms tried to create it at the same time - but
  # since only the Windows job needs to wait for that specific ordering, flatpak-bundle no longer
  # has to (it depends on Linux only), so it now runs in parallel with the Windows build instead of
  # after it.
  publish-tauri-linux:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: novatree-v__VERSION__
          releaseName: "NovaTree v__VERSION__"
          releaseBody: |
            Automatisch von GitHub Actions gebauter Release.
            Lade die passende Installationsdatei für dein Betriebssystem herunter (Windows: `.exe`/`.msi`, Linux: `.deb`/`.rpm`/`.flatpak`).
            Bereits installierte NovaTree-Versionen aktualisieren sich automatisch auf diese Version.
          releaseDraft: false
          prerelease: false

      - name: Upload raw Linux ELF binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          cp src-tauri/target/release/novatree "NovaTree_${version}_linux_amd64"
          gh release upload "novatree-v${version}" "NovaTree_${version}_linux_amd64" --clobber --repo "${{ github.repository }}"

  publish-tauri-windows:
    needs: publish-tauri-linux
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: novatree-v__VERSION__
          releaseName: "NovaTree v__VERSION__"
          releaseBody: |
            Automatisch von GitHub Actions gebauter Release.
            Lade die passende Installationsdatei für dein Betriebssystem herunter (Windows: `.exe`/`.msi`, Linux: `.deb`/`.rpm`/`.flatpak`).
            Bereits installierte NovaTree-Versionen aktualisieren sich automatisch auf diese Version.
          releaseDraft: false
          prerelease: false

  flatpak-bundle:
    needs: publish-tauri-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common

          # Ubuntu 22.04's apt flatpak-builder (1.2.2) predates 1.4, so it still shells out to
          # the removed "appstream-compose" binary inside the sandbox instead of running
          # "appstreamcli compose" on the host - causing "bwrap: execvp appstream-compose: No
          # such file or directory". Installing appstream-compose on the HOST doesn't help since
          # the sandbox can't see host binaries at all. Pull a current flatpak-builder from the
          # upstream PPA instead, plus "appstream" for appstreamcli itself.
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-gnome50-node24-rust-${{ runner.os }}

      - name: Cache Flatpak builder state (sources + per-module build cache)
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/com.novatree.app.yaml', 'flatpak/cargo-sources.json', 'flatpak/node-sources.json', 'src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            flatpak-builder-

      - name: Install GNOME Flatpak runtime + SDK + extensions
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.node24//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build flatpak/com.novatree.app.yaml
          flatpak build-bundle flatpak-repo NovaTree.flatpak com.novatree.app

      - name: Read app version
        id: app_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload Flatpak bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "novatree-v${{ steps.app_version.outputs.version }}" NovaTree.flatpak --clobber --repo "${{ github.repository }}"
