[package]
name = "novatree-cli"
version = "0.8.17"
description = "NovaTree CLI - ask-only terminal companion for the NovaTree desktop app"
edition = "2021"

[[bin]]
name = "novatree-cli"
path = "src/main.rs"

[dependencies]
novatree_lib = { path = "../..", package = "novatree" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
futures-util = "0.3"
