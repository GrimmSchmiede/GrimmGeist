app-id: com.novatree.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: novatree
separate-locales: false

finish-args:
  # GUI on both Wayland and X11 (with X11 fallback for non-Wayland setups)
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access - without this WebKitGTK cannot create a hardware or software GL/EGL context
  - --device=dri
  # Gemini API requests + update checks
  - --share=network
  # File attachments and workspace folders can be anywhere on disk, chosen via native dialog
  - --filesystem=home
  # keyring crate stores the API key via the Secret Service (GNOME Keyring / KWallet)
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-run/keyring
  # WebKitGTK's own internal (bubblewrap) sandbox nested inside Flatpak's sandbox breaks the
  # localhost connection it uses internally to serve app assets ("could not connect to
  # localhost", blank window). Flatpak's own sandbox already isolates the app, so WebKit's
  # redundant inner sandbox is disabled - standard fix for WebKitGTK apps under Flatpak.
  - --env=WEBKIT_FORCE_SANDBOX=0

modules:
  - name: novatree
    buildsystem: simple
    build-commands:
      - install -Dm755 novatree /app/bin/novatree
      - install -Dm644 novatree.desktop /app/share/applications/com.novatree.app.desktop
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.novatree.app.png
    sources:
      - type: file
        path: ../src-tauri/target/release/novatree
        dest-filename: novatree
      - type: file
        path: novatree.desktop
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: icon-128.png
