<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaTree</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="titlebar" data-tauri-drag-region>
      <div class="titlebar-brand" data-tauri-drag-region>
        <img src="/icon.png" class="titlebar-logo" alt="" data-tauri-drag-region />
        <span class="titlebar-title" data-tauri-drag-region>NovaTree</span>
        <button id="titlebar-version" class="titlebar-version" title="Was ist neu"></button>
      </div>
      <div class="titlebar-controls">
        <div class="lang-switch">
          <button id="lang-de" class="lang-btn" title="Deutsch">
            <svg viewBox="0 0 5 3" xmlns="http://www.w3.org/2000/svg">
              <rect width="5" height="1" y="0" fill="#000000" />
              <rect width="5" height="1" y="1" fill="#DD0000" />
              <rect width="5" height="1" y="2" fill="#FFCE00" />
            </svg>
          </button>
          <button id="lang-en" class="lang-btn" title="English">
            <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
              <rect width="60" height="30" fill="#00247d" />
              <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6" />
              <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2" />
              <path d="M30,0 V30 M0,15 H60" stroke="#ffffff" stroke-width="10" />
              <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6" />
            </svg>
          </button>
        </div>
        <button id="titlebar-minimize" class="titlebar-btn" title="Minimieren">🗕</button>
        <button id="titlebar-maximize" class="titlebar-btn" title="Maximieren">☐</button>
        <button id="titlebar-close" class="titlebar-btn titlebar-close" title="Schließen">✕</button>
      </div>
    </div>

    <div id="update-banner" class="update-banner hidden">
      <span id="update-banner-text">Update verfügbar</span>
      <button id="update-install-btn" class="update-install-btn">Jetzt installieren</button>
      <button id="update-dismiss-btn" class="update-dismiss-btn" title="Später">✕</button>
    </div>

    <div class="app">
      <aside class="sidebar">
        <button id="new-chat-btn" class="new-chat-btn">
          <span class="icon">+</span> <span id="new-chat-label">Neuer Chat</span>
        </button>
        <div id="chat-list" class="chat-list"></div>
        <button id="settings-btn" class="settings-btn" title="Einstellungen">
          <span class="icon">⚙</span> <span id="settings-label">Einstellungen</span>
        </button>
      </aside>

      <section id="editor-pane" class="editor-pane hidden">
        <div class="editor-toolbar">
          <div id="editor-tabs" class="editor-tabs"></div>
          <button id="editor-save-btn" class="icon-btn editor-save-btn hidden" title="Speichern">💾</button>
        </div>
        <div id="editor-empty" class="editor-empty"></div>
        <div id="editor-container" class="editor-container hidden"></div>
      </section>

      <button id="editor-collapse-handle" class="editor-collapse-handle" title="Live-Editor ein-/ausblenden">
        <span id="editor-collapse-icon">‹</span>
      </button>

      <main class="main">
        <header class="chat-header">
          <select id="model-select" class="model-select"></select>
          <div class="status-bar">
            <span id="token-usage" class="status-pill">Tokens: 0</span>
            <span id="quota-usage" class="status-pill">Anfragen heute: 0 / 1000</span>
          </div>
        </header>

        <div class="workspace-bar">
          <button id="workspace-pick-btn" class="icon-btn" title="Arbeitsordner wählen">📁</button>
          <span id="workspace-path" class="workspace-path">Kein Arbeitsordner verknüpft</span>
          <button id="workspace-toggle-btn" class="icon-btn hidden" title="Dateien anzeigen">▾</button>
          <button id="workspace-detach-btn" class="icon-btn hidden" title="Ordner entfernen">✕</button>
        </div>
        <div id="workspace-files" class="workspace-files hidden"></div>

        <div id="messages" class="messages"></div>

        <footer class="composer">
          <div id="attachments" class="attachments"></div>
          <div id="cooldown-notice" class="cooldown-notice hidden"></div>
          <div class="composer-row">
            <button id="attach-btn" class="icon-btn" title="Datei anhängen">📎</button>
            <textarea
              id="prompt-input"
              class="prompt-input"
              placeholder="Nachricht an NovaTree…"
              rows="1"
            ></textarea>
            <button id="send-btn" class="send-btn" title="Senden">➤</button>
          </div>
        </footer>
      </main>
    </div>

    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2 id="settings-title">Einstellungen</h2>
          <button id="settings-close" class="icon-btn">✕</button>
        </div>
        <div class="modal-body">
          <label class="field-label" id="api-key-label" for="api-key-input">Google AI Studio API-Schlüssel</label>
          <input
            id="api-key-input"
            class="text-input"
            type="password"
            placeholder="AIza…"
            autocomplete="off"
          />
          <p class="field-hint" id="api-key-hint">
            Wird sicher im Betriebssystem-Schlüsselbund gespeichert (Windows Credential
            Manager / Linux Secret Service), niemals im Quellcode oder Klartext.
          </p>

          <label class="field-label" id="system-prompt-label" for="system-prompt-input">System-Prompt</label>
          <textarea id="system-prompt-input" class="text-input" rows="6"></textarea>

          <label class="field-label" id="safety-label" for="safety-select">Sicherheitsfilter</label>
          <select id="safety-select" class="text-input">
            <option value="BLOCK_NONE">Kein Filter (BLOCK_NONE)</option>
            <option value="BLOCK_ONLY_HIGH">Nur hohes Risiko blockieren</option>
            <option value="BLOCK_MEDIUM_AND_ABOVE" selected>Standard (mittel und höher)</option>
            <option value="BLOCK_LOW_AND_ABOVE">Streng (niedrig und höher)</option>
          </select>

          <div class="modal-actions">
            <button id="settings-save" class="primary-btn">Speichern</button>
          </div>
        </div>
      </div>
    </div>

    <div id="patchnotes-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2 id="patchnotes-title">Was ist neu</h2>
          <button id="patchnotes-close" class="icon-btn">✕</button>
        </div>
        <div id="patchnotes-body" class="modal-body patchnotes-body"></div>
      </div>
    </div>
  </body>
</html>
